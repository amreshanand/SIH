services:
  # 1. UrbanSense FastAPI Backend
  - type: web
    name: urbansense-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /api/system/health
    envVars:
      - key: PORT
        value: 8000
      - key: PRODUCTION
        value: "false"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: EDGE_API_KEY
        value: "urbansense-edge-key-change-me"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: urbansense-db
          property: connectionString

  # 2. UrbanSense Next.js Frontend
  - type: web
    name: urbansense-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    plan: free
    region: oregon
    healthCheckPath: /
    dockerBuildArgs:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: urbansense-backend
          property: hostWithScheme
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: urbansense-backend
          property: hostWithScheme
    envVars:
      - key: PORT
        value: 3000

databases:
  # 3. PostgreSQL Database
  - name: urbansense-db
    plan: free
    region: oregon
    databaseName: urbansense
    user: urbansense
