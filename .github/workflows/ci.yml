name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint / typecheck / tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: urbansense
          POSTGRES_PASSWORD: urbansense
          POSTGRES_DB: urbansense_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U urbansense -d urbansense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://urbansense:urbansense@127.0.0.1:5432/urbansense_test
      JWT_SECRET_KEY: ci-secret-key
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx ruff
      - name: Ruff lint (backend)
        working-directory: backend
        run: ruff check app tests --output-format=concise
      - name: Backend import smoke (edge-free)
        working-directory: backend
        run: python -c "from backend.app.api.router import api_router; print('routes:', len(api_router.routes))"
      - name: Migrate database
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://urbansense:urbansense@127.0.0.1:5432/urbansense_test
      - name: Run pytest suite
        working-directory: backend
        run: pytest -q --maxfail=1

  frontend:
    name: Frontend (lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build